<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Focus - Минималистичный трекер задач</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --secondary-color: #5856D6;
            --success-color: #34C759;
            --warning-color: #FF9500;
            --danger-color: #FF3B30;
            --background: #FFFFFF;
            --surface: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --border-color: #E5E5EA;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--background);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .header {
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-display h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-display p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        .progress-ring {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 3;
        }

        .progress-ring-fill {
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-dasharray: 176;
            stroke-dashoffset: 176;
            transition: stroke-dashoffset 0.5s ease;
            stroke-linecap: round;
        }

        .progress-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 600;
        }

        .category-tabs {
            display: flex;
            padding: 20px 20px 0;
            gap: 10px;
            background: var(--background);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-button:hover {
            background: var(--surface);
        }

        .tab-button.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-icon {
            font-size: 20px;
        }

        .tab-label {
            font-size: 12px;
            font-weight: 500;
        }

        .main-content {
            padding: 20px;
            min-height: 400px;
        }

        .task-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
            background: var(--surface);
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
        }

        .add-button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-button:hover {
            transform: scale(1.05);
            background: var(--secondary-color);
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            padding: 16px;
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }

        .task-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: var(--primary-color);
        }

        .task-checkbox.checked {
            background: var(--success-color);
            border-color: var(--success-color);
        }

        .task-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-delete {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--danger-color);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .task-item:hover .task-delete {
            opacity: 1;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .stat-card {
            text-align: center;
            padding: 12px;
            background: var(--surface);
            border-radius: 12px;
        }

        .stat-value {
            display: block;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer {
            padding: 20px;
            background: var(--surface);
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .close-modal {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
        }

        .history-content {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(70vh - 80px);
        }

        .history-task {
            padding: 10px;
            background: var(--surface);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="date-display">
                <h1 id="currentDate">Понедельник, 11 ноября 2024</h1>
                <p id="greeting">Добро пожаловать!</p>
            </div>
            <div class="progress-ring">
                <svg width="60" height="60">
                    <circle class="progress-ring-bg" cx="30" cy="30" r="28"></circle>
                    <circle class="progress-ring-fill" cx="30" cy="30" r="28"></circle>
                </svg>
                <span class="progress-percentage">0%</span>
            </div>
        </header>

        <nav class="category-tabs">
            <button class="tab-button active" data-category="work">
                <span class="tab-icon">💼</span>
                <span class="tab-label">Работа</span>
            </button>
            <button class="tab-button" data-category="personal">
                <span class="tab-icon">🏠</span>
                <span class="tab-label">Личное</span>
            </button>
            <button class="tab-button" data-category="health">
                <span class="tab-icon">💪</span>
                <span class="tab-label">Здоровье</span>
            </button>
            <button class="tab-button" data-category="learning">
                <span class="tab-icon">📚</span>
                <span class="tab-label">Обучение</span>
            </button>
        </nav>

        <main class="main-content">
            <div class="task-input-container">
                <input type="text" id="taskInput" placeholder="Добавить новую задачу..." class="task-input">
                <button id="addTaskBtn" class="add-button">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path d="M10 5v10M5 10h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <div class="tasks-container">
                <div id="tasksList" class="tasks-list">
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <p style="font-size: 18px; margin-bottom: 8px;">Нет задач</p>
                        <p style="font-size: 14px;">Добавьте первую задачу</p>
                    </div>
                </div>
            </div>

            <div class="stats-container">
                <div class="stat-card">
                    <span class="stat-value" id="todayCompleted">0</span>
                    <span class="stat-label">Выполнено сегодня</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="weekCompleted">0</span>
                    <span class="stat-label">За неделю</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="streak">0</span>
                    <span class="stat-label">Дней подряд</span>
                </div>
            </div>
        </main>

        <footer class="footer">
            <button id="historyBtn" class="footer-button">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M10 6v4l2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                История
            </button>
            <button id="syncBtn" class="footer-button">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <path d="M10 3v4M10 13v4M7 10H3M13 10h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Синхронизация
            </button>
        </footer>

        <div id="historyModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>История задач</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div id="historyContent" class="history-content">
                    <p style="text-align: center; color: var(--text-secondary);">История пуста</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TaskTracker {
            constructor() {
                this.currentCategory = 'work';
                this.tasks = this.loadTasks();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateDate();
                this.renderTasks();
                this.updateStats();
                this.updateProgress();
            }

            setupEventListeners() {
                // Category tabs
                document.querySelectorAll('.tab-button').forEach(button => {
                    button.addEventListener('click', (e) => {
                        this.switchCategory(e.target.closest('.tab-button').dataset.category);
                    });
                });

                // Add task
                document.getElementById('addTaskBtn').addEventListener('click', () => this.addTask());
                document.getElementById('taskInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // History modal
                document.getElementById('historyBtn').addEventListener('click', () => this.showHistory());
                document.querySelector('.close-modal').addEventListener('click', () => this.closeHistory());
                
                // Sync button
                document.getElementById('syncBtn').addEventListener('click', () => this.syncData());

                // Close modal on outside click
                document.getElementById('historyModal').addEventListener('click', (e) => {
                    if (e.target.id === 'historyModal') this.closeHistory();
                });
            }

            switchCategory(category) {
                this.currentCategory = category;
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-category="${category}"]`).classList.add('active');
                this.renderTasks();
            }

            addTask() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();
                
                if (!text) return;

                const task = {
                    id: Date.now().toString(),
                    text: text,
                    category: this.currentCategory,
                    completed: false,
                    createdAt: new Date().toISOString(),
                    completedAt: null
                };

                const today = this.getTodayKey();
                if (!this.tasks[today]) {
                    this.tasks[today] = [];
                }
                
                this.tasks[today].push(task);
                this.saveTasks();
                this.renderTasks();
                this.updateStats();
                
                input.value = '';
                input.focus();
            }

            toggleTask(taskId) {
                const today = this.getTodayKey();
                const task = this.tasks[today]?.find(t => t.id === taskId);
                
                if (task) {
                    task.completed = !task.completed;
                    task.completedAt = task.completed ? new Date().toISOString() : null;
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                    this.updateProgress();
                }
            }

            deleteTask(taskId) {
                const today = this.getTodayKey();
                if (this.tasks[today]) {
                    this.tasks[today] = this.tasks[today].filter(t => t.id !== taskId);
                    if (this.tasks[today].length === 0) {
                        delete this.tasks[today];
                    }
                    this.saveTasks();
                    this.renderTasks();
                    this.updateStats();
                    this.updateProgress();
                }
            }

            renderTasks() {
                const container = document.getElementById('tasksList');
                const today = this.getTodayKey();
                const todayTasks = this.tasks[today] || [];
                const categoryTasks = todayTasks.filter(t => t.category === this.currentCategory);
                
                if (categoryTasks.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <p style="font-size: 18px; margin-bottom: 8px;">Нет задач</p>
                            <p style="font-size: 14px;">Добавьте первую задачу в категорию "${this.getCategoryName(this.currentCategory)}"</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                categoryTasks.forEach(task => {
                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item';
                    taskItem.dataset.taskId = task.id;
                    
                    const checkbox = document.createElement('div');
                    checkbox.className = `task-checkbox ${task.completed ? 'checked' : ''}`;
                    checkbox.addEventListener('click', () => this.toggleTask(task.id));
                    
                    const text = document.createElement('span');
                    text.className = `task-text ${task.completed ? 'completed' : ''}`;
                    text.textContent = task.text;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'task-delete';
                    deleteBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 20 20">
                            <path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    `;
                    deleteBtn.addEventListener('click', () => this.deleteTask(task.id));
                    
                    taskItem.appendChild(checkbox);
                    taskItem.appendChild(text);
                    taskItem.appendChild(deleteBtn);
                    container.appendChild(taskItem);
                });
            }

            updateDate() {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const dateStr = now.toLocaleDateString('ru-RU', options);
                
                document.getElementById('currentDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                
                const hour = now.getHours();
                let greeting = 'Добрый вечер';
                if (hour < 12) greeting = 'Доброе утро';
                else if (hour < 18) greeting = 'Добрый день';
                
                document.getElementById('greeting').textContent = `${greeting}! Время продуктивности`;
            }

            updateStats() {
                const today = this.getTodayKey();
                const todayTasks = this.tasks[today] || [];
                const todayCompleted = todayTasks.filter(t => t.completed).length;
                document.getElementById('todayCompleted').textContent = todayCompleted;

                const weekCompleted = this.getWeekCompleted();
                document.getElementById('weekCompleted').textContent = weekCompleted;

                const streak = this.calculateStreak();
                document.getElementById('streak').textContent = streak;
            }

            updateProgress() {
                const today = this.getTodayKey();
                const todayTasks = this.tasks[today] || [];
                
                if (todayTasks.length === 0) {
                    this.setProgress(0);
                    return;
                }

                const completed = todayTasks.filter(t => t.completed).length;
                const percentage = Math.round((completed / todayTasks.length) * 100);
                this.setProgress(percentage);
            }

            setProgress(percentage) {
                const circle = document.querySelector('.progress-ring-fill');
                const text = document.querySelector('.progress-percentage');
                const circumference = 2 * Math.PI * 28;
                const offset = circumference - (percentage / 100 * circumference);
                
                circle.style.strokeDashoffset = offset;
                text.textContent = `${percentage}%`;
            }

            getWeekCompleted() {
                const now = new Date();
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                let count = 0;

                Object.keys(this.tasks).forEach(date => {
                    const taskDate = new Date(date);
                    if (taskDate >= weekAgo && taskDate <= now) {
                        count += this.tasks[date].filter(t => t.completed).length;
                    }
                });

                return count;
            }

            calculateStreak() {
                const dates = Object.keys(this.tasks)
                    .filter(date => this.tasks[date].some(t => t.completed))
                    .sort()
                    .reverse();

                if (dates.length === 0) return 0;

                let streak = 0;
                let currentDate = new Date();
                currentDate.setHours(0, 0, 0, 0);

                for (const date of dates) {
                    const taskDate = new Date(date);
                    taskDate.setHours(0, 0, 0, 0);

                    const diffDays = Math.floor((currentDate - taskDate) / (1000 * 60 * 60 * 24));

                    if (diffDays === streak) {
                        streak++;
                    } else {
                        break;
                    }
                }

                return streak;
            }

            showHistory() {
                const modal = document.getElementById('historyModal');
                const content = document.getElementById('historyContent');
                
                const sortedDates = Object.keys(this.tasks).sort().reverse();
                
                if (sortedDates.length === 0) {
                    content.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">История пуста</p>';
                } else {
                    content.innerHTML = '';
                    sortedDates.forEach(date => {
                        const tasks = this.tasks[date];
                        const completedTasks = tasks.filter(t => t.completed);
                        
                        if (completedTasks.length === 0) return;
                        
                        const dayDiv = document.createElement('div');
                        dayDiv.style.marginBottom = '20px';
                        
                        const dateDiv = document.createElement('div');
                        dateDiv.style.fontSize = '14px';
                        dateDiv.style.fontWeight = '600';
                        dateDiv.style.color = 'var(--text-secondary)';
                        dateDiv.style.marginBottom = '10px';
                        dateDiv.textContent = this.formatDate(date);
                        dayDiv.appendChild(dateDiv);
                        
                        completedTasks.forEach(task => {
                            const taskDiv = document.createElement('div');
                            taskDiv.className = 'history-task';
                            taskDiv.textContent = `[${this.getCategoryName(task.category)}] ${task.text}`;
                            dayDiv.appendChild(taskDiv);
                        });
                        
                        content.appendChild(dayDiv);
                    });
                }
                
                modal.classList.add('active');
            }

            closeHistory() {
                document.getElementById('historyModal').classList.remove('active');
            }

            syncData() {
                const syncBtn = document.getElementById('syncBtn');
                alert('Данные сохранены локально. Для синхронизации между устройствами подключите Firebase или другой сервис.');
            }

            getTodayKey() {
                const today = new Date();
                return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            }

            formatDate(dateStr) {
                const date = new Date(dateStr);
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (dateStr === this.getTodayKey()) {
                    return 'Сегодня';
                } else if (dateStr === `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`) {
                    return 'Вчера';
                } else {
                    return date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
                }
            }

            getCategoryName(category) {
                const names = {
                    work: 'Работа',
                    personal: 'Личное',
                    health: 'Здоровье',
                    learning: 'Обучение'
                };
                return names[category] || category;
            }

            saveTasks() {
                localStorage.setItem('taskTrackerData', JSON.stringify(this.tasks));
            }

            loadTasks() {
                try {
                    const data = localStorage.getItem('taskTrackerData');
                    return data ? JSON.parse(data) : {};
                } catch (error) {
                    console.error('Error loading tasks:', error);
                    return {};
                }
            }
        }

        // Initialize the app
        let taskTracker;
        document.addEventListener('DOMContentLoaded', () => {
            taskTracker = new TaskTracker();
            
            // Update time every minute
            setInterval(() => {
                taskTracker.updateDate();
            }, 60000);
        });
    </script>
</body>
</html>
